<title>Backyard</title>

<style>
  :root {
    --ground: #F6F7F8;
    --panel: #FFFFFF;
    --ink: #121417;
    --grey: #8A9096;
    --hair: #C9CDD1;
    --hover: #EEF0F1;
    --accent: #F2B705;
    --sans: 'Overpass', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'Overpass Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --gut: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; overscroll-behavior: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  #fade { position: fixed; inset: 0; background: var(--ground); opacity: 0; pointer-events: none; z-index: 1; }
  #boot {
    position: fixed; left: 0; right: 0; top: 46%; text-align: center; z-index: 1;
    font: 500 10px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
    padding: 0 var(--gut);
  }

  /* ---------- sheet UI ---------- */
  .ui {
    position: fixed; left: var(--gut); right: var(--gut); bottom: var(--gut); z-index: 2;
    display: flex; align-items: flex-end; gap: 20px; pointer-events: none;
  }
  .ui > * { pointer-events: auto; }
  .label {
    display: block; font: 400 9px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--grey);
  }

  .timeline {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--ink);
    padding: 12px 16px 26px;
  }
  .btn {
    flex: none; width: 66px; height: 26px; margin: 0; padding: 0;
    background: var(--panel); color: var(--ink); border: 1px solid var(--ink); border-radius: 0;
    font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .btn:hover { background: var(--hover); }
  .btn[aria-pressed="true"], .btn[aria-pressed="true"]:hover { background: var(--accent); color: var(--ink); }
  .btn:focus-visible, .tick:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .scrub { position: relative; flex: 1; min-width: 0; height: 26px; margin-left: 4px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; background: transparent;
    width: 100%; height: 26px; margin: 0; padding: 0; cursor: pointer; display: block;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--ink); border: 0; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--ink); border: 0; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 10px; height: 18px; margin-top: -9px;
    background: var(--accent); border: 1px solid var(--ink); border-radius: 0; box-shadow: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 8px; height: 16px; background: var(--accent); border: 1px solid var(--ink); border-radius: 0; box-shadow: none;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--ink); outline-offset: 2px; }
  input[type=range]:focus-visible::-moz-range-thumb { outline: 2px solid var(--ink); outline-offset: 2px; }
  .ticks { position: absolute; left: 5px; right: 5px; top: 0; height: 26px; pointer-events: none; }
  .tick {
    position: absolute; top: 4px; transform: translateX(-50%); pointer-events: auto;
    background: none; border: 0; margin: 0; padding: 22px 6px 0; height: 26px; cursor: pointer;
    font: 400 9px/1 var(--mono); letter-spacing: .08em; color: var(--grey);
  }
  .tick::before { content: ""; position: absolute; left: 50%; top: 4px; width: 1px; height: 12px; background: var(--ink); }
  .tick.on { font-weight: 500; color: var(--ink); }
  .tick.on::before { top: 2px; width: 7px; height: 16px; margin-left: -3px; background: var(--accent); border: 1px solid var(--ink); }

  .titleblock {
    flex: none; width: 276px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px;
    background: var(--ink); border: 1px solid var(--ink); color: var(--ink);
  }
  .cell { grid-column: span 3; background: var(--panel); padding: 7px 10px 8px; min-width: 0; }
  .cell.sheet { grid-column: 1 / -1; }
  .cell .v { display: block; margin-top: 6px; font: 600 15px/1.1 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .m { font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: 0; }
  .cell .v .m { margin-right: .35em; }

  @media (max-width: 640px) {
    :root { --gut: 16px; }
    .ui { flex-direction: column-reverse; align-items: stretch; gap: 8px; }
    .titleblock { width: 100%; }
    .cell { grid-column: span 2; padding: 6px 9px 7px; }
    .cell.sheet { grid-column: span 3; order: 3; }
    .cell.scale { grid-column: span 3; order: 4; }
    .cell .v { font-size: 14px; margin-top: 5px; }
    .cell .m { font-size: 12px; }
    .timeline { padding: 10px 12px 24px; gap: 8px; }
    .btn { width: 56px; }
    .scrub { margin-left: 2px; }
  }
  @media (prefers-reduced-motion: reduce) { canvas#c { cursor: default; } }
</style>

/* =====================================================================
   5. LINE SET
   Each segment gets a draw-order key, a weight class, and a perpendicular
   offset vector (used for the parallel copies of the heavy class).

const HEAVY_OFFSET = 0.045;   // ft in plan
function buildLines(segs, useRank) {
  const n = segs.length;

  const ordOf = new Float32Array(n);
  order.forEach((e, rank) => { ordOf[e.i] = rank / n * 0.93; });

  const O = new Float32Array(n * 2), Cl = new Float32Array(n * 2), Off = new Float32Array(n * 6);
  const d = V(0, 0, 0);
  segs.forEach((s, i) => {
    d.subVectors(s.b, s.a); const len = d.length(); if (len > 0) d.divideScalar(len);
    const a = s.a, b = s.b;
    const ox = -d.z * HEAVY_OFFSET, oz = d.x * HEAVY_OFFSET;   // perpendicular in the ground plane (zero for vertical segments)
    const ord = useRank ? ordOf[i] : s.ord;
    for (let v = 0; v < 2; v++) {
      const j = i * 2 + v, j3 = j * 3;
      P[j3] = a.x; P[j3 + 1] = a.y; P[j3 + 2] = a.z;
      S[j3] = a.x; S[j3 + 1] = a.y; S[j3 + 2] = a.z;
      E[j3] = b.x; E[j3 + 1] = b.y; E[j3 + 2] = b.z;

  g.setAttribute('aEnd', new THREE.BufferAttribute(E, 3));
  g.setAttribute('aT', new THREE.BufferAttribute(Tt, 1));
  g.setAttribute('aOrd', new THREE.BufferAttribute(O, 1));
  g.setAttribute('aCls', new THREE.BufferAttribute(Cl, 1));
  g.setAttribute('aOff', new THREE.BufferAttribute(Off, 3));

}

/* drawing extents (for the plan camera): every line and label that exists in stage 1 */
const DRAW = (() => {
  let x0 = BX0, x1 = BX1, y0 = BY0, y1 = BY1;
  for (const s of dimSegs) for (const p of [s.a, s.b]) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, -p.z); y1 = Math.max(y1, -p.z); }
  return { x0: x0 - 3, x1: x1 + 4.5, y0: y0 - 3, y1: y1 + 2, w: x1 - x0 + 7.5, h: y1 - y0 + 5, cx: (x0 + x1) / 2 + 0.75, cy: (y0 + y1) / 2 - 0.5 };
})();

/* =====================================================================
   6. TSL MATERIALS
   ===================================================================== */
const aMeta = attribute('aMeta', 'vec4'), aCenter = attribute('aCenter', 'vec3');
const aLvl = aMeta.x, aOrder = aMeta.y, aAcc = aMeta.z, aFlat = aMeta.w;
const aFin = attribute('aFin', 'vec3'), aAxis = attribute('aAxis', 'vec3'), aSize = attribute('aSize', 'vec3');
const hash1 = (x) => fract(sin(x.mul(12.9898).add(78.233)).mul(43758.5453));
const h21 = (p) => fract(sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453));
const h22 = (p) => vec2(h21(p), h21(p.add(vec2(41.3, 17.9))));
// pixels per foot at this fragment, so fine patterns fade out instead of shimmering
const pxFt = uPxK.div(max(length(cameraPosition.sub(positionWorld)), 1.0));
const lod = (wavelength) => smoothstep(0.7, 3.0, pxFt.mul(wavelength));
const n3 = (p, s) => mx_noise_float(p.mul(s));

// architectural clay: volumes matte white-grey, ground features slightly darker, detail parts darker again
const CLAY = color(0xE9EBEC), CLAY_GND = color(0xD5D8DA), CLAY_DET = color(0xBFC3C6), CLAY_DEEP = color(0xD0D3D6);
const MASS = {
  lawn: CLAY_GND, stone: CLAY_GND, mulch: CLAY_GND, concrete: CLAY_GND, deckblock: CLAY, wood: CLAY, trim: CLAY,
  siding: CLAY, roof: CLAY, glass: CLAY, juniper: CLAY, bark: CLAY, needle: CLAY
};
const DETAIL = { wood: CLAY_DET, trim: CLAY_DET, glass: color(0xA4AAAF) };   // everything else keeps its massing colour in stage 3

/* voronoi in the plane: nearest and second-nearest feature distance plus a stable id of the nearest cell */
function voronoi(p) {
  const ip = floor(p), fp = fract(p);
  let f1 = float(9), f2 = float(9), id = float(0);
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const g = vec2(i, j), cell = ip.add(g);
    const d = length(g.add(h22(cell)).sub(fp));
    const nw = step(d, f1);
    f2 = mix(min(f2, d), f1, nw);
    id = mix(id, h21(cell.add(vec2(11.3, 5.7))), nw);
    f1 = min(f1, d);
  }
  return { f1, f2, id };
}
const stoneCells = () => {
  const P = positionWorld;
  const warp = vec2(mx_noise_float(vec3(P.x.mul(0.33), 0.5, P.z.mul(0.33))), mx_noise_float(vec3(P.x.mul(0.33), 7.5, P.z.mul(0.33)))).mul(0.22);
  const v = voronoi(vec2(P.x, P.z).mul(0.5).add(warp));
  const edge = v.f2.sub(v.f1);
  return { edge, id: v.id, mortar: float(1).sub(smoothstep(0.012, 0.05, edge)) };
};

/* stage 3: secondary parts rise in from their own base, staggered by aOrder; cubic ease-out, no overshoot */
const popPosition = (organic = false) => {
  const p = clamp(uDetail.sub(aOrder.mul(0.72)).div(0.26), 0, 1);
  const q = float(1).sub(p), e = float(1).sub(q.mul(q).mul(q));   // ease-out cubic
  // plants grow uniformly from their base; hard parts keep their footprint and rise through it
  const sy = mix(float(1), e, aLvl), sxz = mix(float(1), organic ? e : mix(float(0.9), float(1), e).mul(step(0.0005, e)), aLvl);
  const rel = positionLocal.sub(aCenter);
  return vec3(aCenter.x.add(rel.x.mul(sxz)), aCenter.y.add(rel.y.mul(sy)), aCenter.z.add(rel.z.mul(sxz)));
};
/* stage 2: flat ground features wipe in west to east; volumes exist only below a rising height cutoff */
const wipeX = () => mix(float(BX0 - 8), float(BX1 + 8), clamp(uMass.div(0.42), 0, 1));
const MASS_TOP = ROOF_HIGH + 1.2;   // cutoff must clear the top of the shed roof
const ROOF_SIN = (ROOF_HIGH - EAVE_Y) / Math.hypot(ROOF_HIGH - EAVE_Y, bRoof.h);
const cutY = () => clamp(uMass.sub(0.16).div(0.84), 0, 1).mul(MASS_TOP).sub(0.6);
const massMask = () => aLvl.greaterThan(0.5)
  .or(aFlat.greaterThan(0.5).and(positionWorld.x.lessThan(wipeX())))
  .or(aFlat.lessThan(0.5).and(positionWorld.y.lessThan(cutY())));

/* stage 4: noisy dissolve from massing colour to finished colour, sweeping west to east */
const dissolve = () => {
  const P = positionWorld;
  const d = mx_noise_float(P.mul(0.11)).mul(0.5).add(0.5).mul(0.55)
    .add(mx_noise_float(P.mul(0.9)).mul(0.09)).add(P.x.sub(BX0).div(BX1 - BX0).mul(0.3)).add(P.y.mul(0.008));
  const t = uFinish.mul(1.6).sub(0.22);
  const m = smoothstep(d.sub(0.05), d.add(0.05), t);
  return { m, band: m.mul(float(1).sub(m)).mul(4) };
};

/* ---- finished-surface patterns: true-to-life, slightly desaturated ---- */
const lawnFin = Fn(() => {
  const P = positionWorld;
  const low = mx_noise_float(vec3(P.x.mul(0.07), 0.3, P.z.mul(0.07)));
  const mid = mx_noise_float(vec3(P.x.mul(0.85), 1.7, P.z.mul(0.85)));
  const tuft = mx_noise_float(vec3(P.x.mul(3.4), 4.1, P.z.mul(3.4))).mul(lod(0.3));
  const blade = mx_noise_float(vec3(P.x.mul(30), 6.3, P.z.mul(30))).mul(lod(0.033));
  const stripe = smoothstep(-0.3, 0.3, sin(P.z.add(P.x.mul(0.045)).mul(0.9)));   // mowing stripes
  let c = mix(color(0x4d7239), color(0x6f9250), low.mul(0.5).add(0.5));
  c = mix(c, color(0x7f9a5f), smoothstep(0.3, 0.85, low).mul(0.25));
  c = c.mul(mix(0.9, 1.07, stripe));
  return c.mul(float(1).add(mid.mul(0.09)).add(tuft.mul(0.08)).add(blade.mul(0.16)));
})();

const stoneFin = Fn(() => {
  const P = positionWorld, s = stoneCells();

  c = mix(c, color(0xa39784), smoothstep(0.72, 1.0, t).mul(0.55));
  c = mix(c, color(0xb9b2a3), smoothstep(0.0, 0.18, t).mul(0.5));
  const bevel = smoothstep(0.02, 0.2, s.edge);

  c = c.mul(mix(0.84, 1.04, bevel)).mul(float(1).add(speck));

const mulchFin = Fn(() => {

const concFin = Fn(() => {

  const swirl = mx_noise_float(vec3(P.x.mul(1.7), 3.0, P.z.mul(1.7))).mul(0.5).add(0.5);

const woodFin = Fn(() => {
  const P = positionWorld, rel = P.sub(aCenter), ax = aAxis;

  const g2 = mx_noise_float(vec3(across.mul(34), along.mul(3.2), P.y.mul(34))).mul(lod(0.03));
  let c = aFin.mul(float(1).add(g1.mul(0.12)).add(g2.mul(0.08)));
  const edge = max(smoothstep(aSize.x.sub(0.05), aSize.x, abs(along)), smoothstep(aSize.y.sub(0.055), aSize.y, abs(across))).mul(aSize.z).mul(step(0.6, normalWorld.y));

const trimFin = Fn(() => aFin.mul(float(1).add(mx_noise_float(positionWorld.mul(12)).mul(0.03))))();

const sidingFin = Fn(() => {

const roofFin = Fn(() => {
  const P = positionWorld;
  const rowH = 0.43 * ROOF_SIN, row = floor(P.y.sub(EAVE_Y).div(rowH)), v = fract(P.y.sub(EAVE_Y).div(rowH));
  const u = mix(P.x, P.z, step(abs(normalWorld.z), abs(normalWorld.x)));
  const w = 0.5, off = hash1(row.mul(1.31)).mul(w), cx = u.add(off).div(w), col = floor(cx), cf = fract(cx);
  const t1 = hash1(row.mul(57.3).add(col.mul(3.7)).add(1.0)), t2 = hash1(row.mul(13.1).add(col.mul(9.3)).add(5.0));

})();

const glassFin = Fn(() => {

const barkFin = Fn(() => {

// canopy: matte grey-green, fine low-contrast needle mottling, slightly lighter on top, shaded underneath
const needleFin = Fn(() => {

const kindCfg = {
  lawn:      { fin: lawnFin,     rough: 1.0 },
  stone:     { fin: stoneFin,    rough: 0.9, joints: true },
  mulch:     { fin: mulchFin,    rough: 1.0 },
  concrete:  { fin: concFin,     rough: 0.34 },
  deckblock: { fin: color(0x7d5543), rough: 0.8, block: true },
  wood:      { fin: woodFin,     rough: 0.72 },
  trim:      { fin: trimFin,     rough: 0.65 },
  siding:    { fin: sidingFin,   rough: 0.85 },
  roof:      { fin: roofFin,     rough: 0.92 },
  glass:     { fin: glassFin,    rough: 0.12 },
  juniper:   { fin: juniperFin,  rough: 0.9 },
  bark:      { fin: barkFin,     rough: 0.95 },
  needle:    { fin: needleFin,   rough: 0.9 }
};

function makeSolid(kind) {
  const cfg = kindCfg[kind];
  const m = new MeshStandardNodeMaterial();
  m.metalness = 0;
  m.side = kind === 'needle' ? THREE.DoubleSide : THREE.FrontSide;
  if (!['lawn', 'stone', 'mulch', 'concrete'].includes(kind)) { m.polygonOffset = true; m.polygonOffsetFactor = 1; m.polygonOffsetUnits = 1; }
  let blockK = null;
  if (cfg.block) {
    // the deck's massing block flattens into the deck surface as the boards arrive
    blockK = smoothstep(0.0, 0.2, uDetail);
    const pop = popPosition(false);
    m.positionNode = vec3(pop.x, float(DECK_TOP).sub(float(DECK_TOP).sub(pop.y).mul(float(1).sub(blockK))), pop.z);
    m.maskNode = massMask().and(blockK.lessThan(0.995));
  } else {
    m.positionNode = popPosition(kind === 'juniper' || kind === 'needle' || kind === 'bark');
    m.maskNode = massMask();
  }
  const { m: fm, band } = dissolve();
  m.colorNode = Fn(() => {
    let mass = mix(mix(MASS[kind], DETAIL[kind] || MASS[kind], aLvl), CLAY_DEEP, aAcc);
    if (cfg.joints) {   // paver joints appear as grooves in the detail sheet
      mass = mix(mass, mass.mul(0.58), stoneCells().mortar.mul(smoothstep(0.1, 0.55, uDetail)).mul(smoothstep(0.3, 1.1, pxFt.mul(0.07))));
    }
    // thin ink-grey cut line at the leading edge of the massing (stage 2 only)
    const cutV = smoothstep(cutY().sub(0.16), cutY(), positionWorld.y).mul(aFlat.lessThan(0.5).select(1, 0)).mul(step(aLvl, 0.5));
    const cutF = smoothstep(wipeX().sub(1.4), wipeX(), positionWorld.x).mul(aFlat.greaterThan(0.5).select(1, 0)).mul(step(uMass, 0.5));
    mass = mix(mass, color(0x6b7278), max(cutV, cutF).mul(step(uMass, 0.999)));
    return mix(mass, cfg.fin, fm).mul(float(1).sub(band.mul(0.3)));
  })();
  m.roughnessNode = mix(float(1), float(cfg.rough), fm);
  const mesh = new THREE.Mesh(merged[kind], m);
  mesh.castShadow = kind !== 'lawn'; mesh.receiveShadow = true; mesh.frustumCulled = false;
  return mesh;
}

/* ---- plotted lines: crisp 1px ink; the heavy class adds two parallel copies ---- */
function lineMaterial(side, opU, drawU, spread) {
  const m = new LineBasicNodeMaterial();
  m.transparent = true; m.depthWrite = false; m.fog = false;
  const aS = attribute('aStart', 'vec3'), aE = attribute('aEnd', 'vec3'), aT = attribute('aT', 'float');
  const aO = attribute('aOrd', 'float'), aC = attribute('aCls', 'float'), aOff = attribute('aOff', 'vec3');
  const seg = clamp(drawU.mul(1.08).sub(aO).div(spread), 0, 1);
  let pos = mix(aS, aE, aT.mul(seg));
  if (side) pos = pos.add(aOff.mul(side));
  m.positionNode = pos;
  let col = mix(color(PAL.ink), color(PAL.grey), step(1.5, aC));
  col = mix(col, color(PAL.hair), step(2.5, aC));
  m.colorNode = mix(col, color(0xA9AEB3), uLineTone.mul(step(aC, 2.5)));
  const heavyOnly = side ? step(aC, 0.5) : float(1);
  m.opacityNode = opU.mul(mix(float(1), float(0.9), step(1.5, aC))).mul(heavyOnly).mul(step(0.002, seg));
  return m;
}
const mkLines = (geo, opU, drawU, spread) => [0, 1, -1].map((sd) => new THREE.LineSegments(geo, lineMaterial(sd, opU, drawU, spread)));
const linesSite = mkLines(siteLineGeo, uLineOp, uLine, 0.07), linesDim = mkLines(dimLineGeo, uDimOp, uDim, 0.06);
for (const l of [...linesSite, ...linesDim]) { l.frustumCulled = false; l.renderOrder = 2; }

/* ---- lights ---- */
const hemi = new THREE.HemisphereLight(0xffffff, 0xc9cdd1, 1.6);
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const SH = 62;
sun.shadow.camera.left = -SH; sun.shadow.camera.right = SH; sun.shadow.camera.top = SH; sun.shadow.camera.bottom = -SH;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 420;
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.05; sun.shadow.radius = 2.5;
sun.target.position.set(CX, 2, -CY);

const solids = Object.keys(merged).map(makeSolid);
scene.add(sky, ground, hemi, sun, sun.target, ...linesSite, ...linesDim, ...solids);

/* =====================================================================
   7. PROGRESS -> UNIFORMS / LIGHTS / FOG / CAMERA
   ===================================================================== */
const cA = new THREE.Color();
const sunDir = new THREE.Vector3();
function applyProgress(t) {
  const tt = Math.min(t, DUR);
  const p = tt / DUR;
  const l1 = clamp01((tt - STAGE_START[0]) / STAGE_LEN[0]);
  const l2 = clamp01((tt - STAGE_START[1]) / STAGE_LEN[1]);
  const l3 = clamp01((tt - STAGE_START[2]) / STAGE_LEN[2]);
  const l4 = clamp01((tt - STAGE_START[3]) / STAGE_LEN[3]);
  uProgress.value = p;
  uLine.value = l1;   // steady, mechanical sweep
  uDim.value = clamp01((uLine.value - 0.42) / 0.55);
  uMass.value = 0.5 * (l2 + smooth(l2));
  uDetail.value = l3;
  uFinish.value = l4;
  uGround.value = clamp01(l2 * 2.6);
  // linework: full -> 20% light grey (massing) -> 10% (detail) -> gone (finished)
  uLineOp.value = (1 - 0.8 * smooth(l2 * 1.2)) * (1 - 0.5 * l3) * (1 - smooth(l4 * 1.4));
  uDimOp.value = 1 - smooth(l2 / 0.35);
  uLineTone.value = smooth(l2 / 0.5);
  uBgShop.value = smooth(l2 / 0.6);
  uSky.value = smooth(l4 / 0.85);

  // solids only exist from stage 2 on
  const showSolid = tt >= STAGE_START[1] - 0.001;
  for (const s of solids) s.visible = showSolid;
  ground.visible = showSolid;
  linesSite.forEach((l) => { l.visible = uLineOp.value > 0.004; });
  linesDim.forEach((l) => { l.visible = uDimOp.value > 0.004; });
  for (const lb of labels) {
    const base = lb.kind === 'area' ? 0.3 : 0.55;
    lb.mat.opacity = smooth((uDim.value * 1.08 - lb.ord * (lb.kind === 'area' ? 0.9 : 1) - base * (lb.kind === 'area' ? 0.2 : 0)) / 0.1) * uDimOp.value * (lb.kind === 'area' ? 1 : 1);
    lb.mat.visible = lb.mat.opacity > 0.01;
  }

  // light: soft neutral daylight (sun 58 deg) -> clear midday-to-early-afternoon sun (55 deg), always white
  const g = smooth(l4 / 0.9);
  const el = THREE.MathUtils.degToRad(lerp(58, 55, g)), az = THREE.MathUtils.degToRad(lerp(215, 200, g));   // compass azimuth of the sun
  sunDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 170);
  uSunDir.value.copy(sunDir);
  sun.color.set(0xffffff);
  sun.intensity = lerp(2.5, 3.1, g);
  sun.shadow.radius = lerp(4, 1.6, g);
  hemi.color.set(0xffffff).lerp(cA.set(0xeaf0f6), g);
  hemi.groundColor.set(0xc9cdd1).lerp(cA.set(0x8f9789), g);
  hemi.intensity = lerp(1.7, 1.45, g);
  scene.fog.color.set(0xdde3e8);
  scene.fog.density = planMode ? 0 : 0.0007 * smooth(l4 / 0.9);
}

/* ---- camera: plan view -> three-quarter orbit ---- */
const PLAN_CAM = { phi: 0.015, theta: 0.0, tgt: V(DRAW.cx, 0, -DRAW.cy) };
let planShiftFt = 0;
const ISO_CAM = { phi: 0.98, theta: 0.5, tgt: V(CX + 3, 6, -CY + 1) };
let fitPlanD = 120, fitIsoD = 110, lastCamB = -1, uiH = 100;
function placeCamera(b) {
  const e = smooth(b);
  const phi = lerp(PLAN_CAM.phi, ISO_CAM.phi, smooth(b * 1.15)), th = lerp(PLAN_CAM.theta, ISO_CAM.theta, smooth((b - 0.25) / 0.75)), r = lerp(fitPlanD, fitIsoD, e);
  const tg = PLAN_CAM.tgt.clone().add(V(0, 0, planShiftFt)).lerp(ISO_CAM.tgt, e);
  controls.target.copy(tg);
  camera.position.set(tg.x + r * Math.sin(phi) * Math.sin(th), tg.y + r * Math.cos(phi), tg.z + r * Math.sin(phi) * Math.cos(th));
  camera.lookAt(tg);
  lastCamB = b;
}
const camBlend = (tt) => clamp01((tt - CAM_T0) / (CAM_T1 - CAM_T0));

/* ---- orthographic plan view: frames the plan.json bounds exactly, north up ---- */
function frameOrtho() {
  const w = window.innerWidth, h = window.innerHeight, free = Math.max(120, h - uiH - 8), pad = 14;
  const s = Math.min((w - 2 * pad) / (BX1 - BX0), (free - 2 * pad) / (BY1 - BY0));    // pixels per foot
  const cz = -CY + (h - free) / 2 / s;                                              // push the view centre south so the bounds centre sits in the free area
  ortho.left = -w / 2 / s; ortho.right = w / 2 / s; ortho.top = h / 2 / s; ortho.bottom = -h / 2 / s;
  ortho.position.set(CX, 300, cz); ortho.up.set(0, 0, -1); ortho.lookAt(CX, 0, cz);
  ortho.updateProjectionMatrix();
  return s;
}

/* =====================================================================
   8. UI: CAD title block, scrubber, play/pause, plan toggle, keys
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const scrub = $('scrub'), playBtn = $('play'), planBtn = $('planBtn'), ticksEl = $('ticks'), fadeEl = $('fade');
let t = 0, playing = true, stageIdx = -1, fadeIn = 0;
const tickBtns = STAGE_START.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'tick'; b.type = 'button'; b.textContent = '0' + (i + 1);
  b.style.left = (s / DUR * 100) + '%';
  b.setAttribute('aria-label', 'Jump to sheet ' + SHEETS[i][0] + ', ' + SHEETS[i][1]);
  b.addEventListener('click', () => jumpStage(i));
  ticksEl.appendChild(b); return b;
});
function stageAt(tt) { let s = 0; for (let i = 0; i < 4; i++) if (tt >= STAGE_START[i] - 1e-6) s = i; return s; }
function setPlaying(v) { playing = v; playBtn.textContent = v ? 'PAUSE' : 'PLAY'; playBtn.setAttribute('aria-pressed', String(!!v)); }
function setPlan(v) {
  planMode = !!v;
  planBtn.setAttribute('aria-pressed', String(planMode));
  controls.enabled = !planMode;
  if (planMode) frameOrtho();
  else if (camAuto && Math.min(t, DUR) < CAM_T1) placeCamera(camBlend(Math.min(t, DUR)));
}
function retakeCamera() { camAuto = true; lastCamB = -1; }
function jumpStage(i) { t = STAGE_START[i]; fadeIn = 0; fadeEl.style.opacity = 0; if (i === 0) retakeCamera(); sync(); }
function sync() {
  applyProgress(t);
  const s = stageAt(Math.min(t, DUR));
  if (s !== stageIdx) {
    stageIdx = s;
    $('sheetNo').textContent = SHEETS[s][0]; $('sheetName').textContent = SHEETS[s][1];
    $('scaleV').textContent = s === 0 ? '1/8" = 1\'-0"' : 'NTS';
    tickBtns.forEach((b, i) => b.classList.toggle('on', i === s));
  }
  scrub.value = Math.round(Math.min(t, DUR) / DUR * 1000);
  scrub.setAttribute('aria-valuetext', SHEETS[s][0] + ' ' + SHEETS[s][1]);
}
playBtn.addEventListener('click', () => { setPlaying(!playing); if (playing && t >= DUR) { t = 0; retakeCamera(); } });
planBtn.addEventListener('click', () => setPlan(!planMode));
scrub.addEventListener('input', () => { setPlaying(false); t = scrub.value / 1000 * DUR; fadeIn = 0; fadeEl.style.opacity = 0; if (t < STAGE_START[1]) retakeCamera(); sync(); });
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key >= '1' && e.key <= '4') jumpStage(+e.key - 1);
  else if (e.key === 'p' || e.key === 'P') setPlan(!planMode);
});
// debug / verification hooks
window.__setProgress = (p) => { setPlaying(false); t = clamp01(p) * DUR; fadeIn = 0; fadeEl.style.opacity = 0; if (t < STAGE_START[1]) retakeCamera(); sync(); };
window.__setTime = (s) => { setPlaying(false); t = s; if (s < STAGE_START[1]) retakeCamera(); sync(); };
window.__play = (v) => setPlaying(!!v);
window.__planView = (v) => setPlan(v === undefined ? !planMode : v);
window.__dbg = { merged, scene };
window.__view = { camera, controls, ortho, get planMode() { return planMode; } };
Object.defineProperty(window, '__state', { get: () => ({ t, playing, stage: stageIdx, plan: planMode, backend: renderer.backend && renderer.backend.constructor.name }) });

/* =====================================================================
   9. RESIZE, FIT, LOOP
   ===================================================================== */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  uiH = document.querySelector('.ui').getBoundingClientRect().height + 24;
  camera.setViewOffset(w, h, 0, Math.round(uiH * (w <= 640 ? 0.42 : 0.2)), w, h);
  camera.updateProjectionMatrix();
  uRes.value.set(w, h);
  const tf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const oldIso = fitIsoD;
  const offFrac = w <= 640 ? 0.42 : 0.2;
  fitPlanD = Math.max(DRAW.h * h / (2 * tf * Math.max(200, h - uiH - 10)), (DRAW.w / 2 * 1.12) / (tf * camera.aspect));
  planShiftFt = uiH * (0.5 - offFrac) * 2 * fitPlanD * tf / h;
  fitIsoD = Math.max(41 / tf, 48 / (tf * camera.aspect));
  if (!camAuto && lastCamB >= 0) {   // user has moved the camera: keep their framing, scale with the fit
    const off = camera.position.clone().sub(controls.target);
    off.setLength(off.length() * fitIsoD / oldIso);
    camera.position.copy(controls.target).add(off);
  }
  controls.maxDistance = Math.max(360, fitPlanD * 1.5);
  if (planMode) frameOrtho();
}
window.addEventListener('resize', resize);

try {
  await renderer.init();
  resize();
  sync();
  placeCamera(camBlend(Math.min(t, DUR)));
  $('boot').remove();
  let last = performance.now();
  renderer.setAnimationLoop((now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) {
      t += dt;
      if (t >= DUR + FADE_OUT) { t = 0; fadeIn = FADE_IN; retakeCamera(); }
    }
    if (fadeIn > 0) { fadeIn = Math.max(0, fadeIn - dt); fadeEl.style.opacity = fadeIn / FADE_IN; }
    else fadeEl.style.opacity = playing && t > DUR ? clamp01((t - DUR) / FADE_OUT) : 0;
    sync();
    const tt = Math.min(t, DUR);
    if (camAuto) {
      if (tt < CAM_T1) placeCamera(camBlend(tt));
      else if (lastCamB < 1) placeCamera(1);
    }
    controls.autoRotate = userRotate && !planMode && !(camAuto && tt < CAM_T1);
    if (!planMode) controls.update(dt);
    if (camera.position.y < 0.9) camera.position.y = 0.9;
    // detail level: pixels per foot at one foot of distance
    uPxK.value = planMode ? (ortho.position.y - 1) * (window.innerHeight / (ortho.top - ortho.bottom)) : window.innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    renderer.render(scene, planMode ? ortho : camera);
  });
} catch (err) {
  console.error(err);
  $('boot').textContent = 'This browser could not start WebGPU or WebGL 2.';
}
</script>
</body>
</html>
