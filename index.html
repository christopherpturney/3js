<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treehouse</title>
<meta name="description" content="A treehouse taken through four sheets of an architect's process: first lines, massing, detail, finished.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f0dd;
    --ink: #1f1e1a;
    --trace: #efe3b8;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --hand: 'Architects Daughter', 'Bradley Hand', cursive;
    --gut: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--trace); overflow: hidden; overscroll-behavior: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  #fade { position: fixed; inset: 0; background: var(--trace); opacity: 0; pointer-events: none; z-index: 1; }
  #boot {
    position: fixed; left: 0; right: 0; top: 46%; text-align: center; z-index: 1;
    font: 500 10px/1.4 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink);
    padding: 0 var(--gut);
  }

  /* ---------- drafting UI ---------- */
  .ui {
    position: fixed; left: var(--gut); right: var(--gut); bottom: var(--gut); z-index: 2;
    display: flex; align-items: flex-end; gap: 20px; pointer-events: none;
  }
  .ui > * { pointer-events: auto; }
  .label {
    font: 400 9px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink);
  }

  .timeline {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px;
    background: var(--paper); border: 1px solid var(--ink);
    padding: 12px 16px 26px;
  }
  .btn {
    flex: none; width: 66px; height: 26px; margin: 0; padding: 0;
    background: var(--paper); color: var(--ink); border: 1px solid var(--ink); border-radius: 0;
    font: 500 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn:focus-visible, .tick:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .scrub { position: relative; flex: 1; min-width: 0; height: 26px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; background: transparent;
    width: 100%; height: 26px; margin: 0; padding: 0; cursor: pointer; display: block;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--ink); border: 0; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--ink); border: 0; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 10px; height: 18px; margin-top: -9px;
    background: var(--paper); border: 1px solid var(--ink); border-radius: 0; box-shadow: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 8px; height: 16px; background: var(--paper); border: 1px solid var(--ink); border-radius: 0; box-shadow: none;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb { background: var(--ink); }
  input[type=range]:focus-visible::-moz-range-thumb { background: var(--ink); }
  .ticks { position: absolute; left: 5px; right: 5px; top: 0; height: 26px; pointer-events: none; }
  .tick {
    position: absolute; top: 4px; transform: translateX(-50%); pointer-events: auto;
    background: none; border: 0; margin: 0; padding: 22px 6px 0; height: 26px; cursor: pointer;
    font: 400 9px/1 var(--mono); letter-spacing: .12em; color: var(--ink);
  }
  .tick::before { content: ""; position: absolute; left: 50%; top: 4px; width: 1px; height: 12px; background: var(--ink); }
  .tick.on { font-weight: 500; }
  .tick.on::before { height: 16px; top: 2px; }

  .titleblock {
    flex: none; width: 276px; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--paper); border: 1px solid var(--ink); color: var(--ink);
  }
  .cell { padding: 7px 10px 8px; border-top: 1px solid var(--ink); min-width: 0; }
  .cell:nth-child(-n+1) { border-top: 0; }
  .cell.wide { grid-column: 1 / -1; }
  .cell.half + .cell.half { border-left: 1px solid var(--ink); }
  .cell .v { display: block; margin-top: 6px; font: 400 17px/1.1 var(--hand); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .v b { font-weight: 400; display: inline-block; min-width: 3.4em; }

  @media (max-width: 640px) {
    :root { --gut: 16px; }
    .ui { flex-direction: column-reverse; align-items: stretch; gap: 8px; }
    .titleblock { width: 100%; grid-template-columns: 1fr 1fr; }
    .cell, .cell.wide { grid-column: auto; padding: 6px 9px 7px; border-top: 0; }
    .cell:nth-child(n+3) { border-top: 1px solid var(--ink); }
    .cell:nth-child(even) { border-left: 1px solid var(--ink); }
    .cell .v { font-size: 15px; margin-top: 5px; }
    .cell .v b { min-width: 0; margin-right: .45em; }
    .timeline { padding: 10px 12px 24px; gap: 12px; }
    .btn { width: 58px; }
  }
  @media (prefers-reduced-motion: reduce) { canvas#c { cursor: default; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",

  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message)));

<script type="module">
import * as THREE from 'three';
import {
  MeshStandardNodeMaterial, MeshBasicNodeMaterial, LineBasicNodeMaterial, WebGPURenderer
} from 'three';
import {
  Fn, uniform, attribute, float, vec2, vec3, color, mix, smoothstep, step, clamp, abs, sin, cos,
  floor, fract, dot, normalize, pow, max, min, length,
  positionWorld, positionLocal, normalWorld, cameraPosition, screenUV, mx_noise_float
} from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';

/* =====================================================================
   0. TIMELINE
   One global progress (0..1) over DUR seconds. Stage windows are derived
   from it and fed to the shaders as uniforms.
   ===================================================================== */
const DUR = 28;                                   // seconds, loop length
const STAGE_START = [0, 6.5, 12.5, 18.5];         // stage starts (s)
const STAGE_LEN   = [5.6, 5.0, 5.0, 4.5];         // active build window of each stage (s)
const SHEETS = [['A-101', 'First lines'], ['A-102', 'Massing'], ['A-103', 'Detail'], ['A-104', 'Finished']];
const FADE_OUT = 0.6, FADE_IN = 0.55;             // loop fade (s)

/* ---- shared uniforms ---- */
const uProgress = uniform(0);   // global 0..1
const uLine     = uniform(0);   // stage 1: lines drawn
const uMass     = uniform(0);   // stage 2: height cutoff rising
const uDetail   = uniform(0);   // stage 3: parts popping in
const uFinish   = uniform(0);   // stage 4: material dissolve
const uLineOp   = uniform(1);   // graphite opacity
const uBgShop   = uniform(0);   // paper -> model-shop white
const uSky      = uniform(0);   // shop white -> golden hour sky
const uGround   = uniform(0);   // ground reveal radius
const uSunDir   = uniform(new THREE.Vector3(0, 1, 0));
const uRes      = uniform(new THREE.Vector2(1280, 800));

/* =====================================================================
   1. RENDERER / SCENE / CAMERA
   ===================================================================== */
const canvas = document.getElementById('c');
// WebGPU when available, WebGL2 automatically otherwise (add ?webgl to force the fallback)
const renderer = new WebGPURenderer({ canvas, antialias: true, forceWebGL: /[?&]webgl\b/.test(location.search) });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf3cfa4, 0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 2000);
const TARGET = new THREE.Vector3(0, 6.9, 0);
camera.position.set(10.5, 9.4, 22.5);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 46;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = 1.66;
controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 1.5;
let resumeTimer = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
controls.addEventListener('end', () => {
  clearTimeout(resumeTimer);
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) resumeTimer = setTimeout(() => { controls.autoRotate = true; }, 3000);
});

/* =====================================================================
   2. SMALL HELPERS
   ===================================================================== */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const C = (hex) => new THREE.Color(hex);
const lerp = THREE.MathUtils.lerp;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20260929);
const rr = (a, b) => a + (b - a) * rand();
const noise3 = new ImprovedNoise();

/* =====================================================================
   3. PROCEDURAL TREEHOUSE (geometry)
   Everything is bucketed by material kind and merged. Every vertex carries:
     aMeta   x: level (0 = primary massing volume, 1 = secondary detail)
             y: build order 0..1 for secondary parts (stage 3 stagger)
             z: walnut accent 0..1 in the basswood stages
             w: pattern id (1 = deck planks)
     aCenter part centre (parts scale up from here)
     aFin    finished base colour (linear)
     aAxis   long axis of the part (wood grain direction)
   (kept to 6 vertex buffers: WebGPU allows at most 8)
   ===================================================================== */
const buckets = { bark: [], wood: [], siding: [], roof: [], glass: [], leaf: [], rock: [] };
const segs = [];   // hand-drawn line segments for stage 1

function pushSeg(a, b, first = true, last = true) { segs.push({ a: a.clone(), b: b.clone(), first, last }); }
function stroke(pts) { for (let i = 0; i < pts.length - 1; i++) pushSeg(pts[i], pts[i + 1], i === 0, i === pts.length - 2); }
function collectEdges(g, thr, keep = 1) {
  const eg = new THREE.EdgesGeometry(g, thr);
  const p = eg.attributes.position;
  for (let i = 0; i < p.count; i += 2) if (keep >= 1 || rand() < keep) pushSeg(V(p.getX(i), p.getY(i), p.getZ(i)), V(p.getX(i + 1), p.getY(i + 1), p.getZ(i + 1)));
  eg.dispose();
}

function part(g, o) {
  const kind = o.kind, lvl = o.lvl ?? 1;
  if (g.index) g = g.toNonIndexed();
  if (g.attributes.uv) g.deleteAttribute('uv');
  if (!g.attributes.normal) g.computeVertexNormals();
  if (o.edges !== 0) collectEdges(g, o.edges ?? 28);
  g.computeBoundingBox();
  const bb = g.boundingBox, c = bb.getCenter(V(0, 0, 0)), sz = bb.getSize(V(0, 0, 0));
  let axis = o.axis || g.userData.axis;
  if (!axis) axis = sz.x >= sz.y && sz.x >= sz.z ? V(1, 0, 0) : sz.y >= sz.z ? V(0, 1, 0) : V(0, 0, 1);
  const fin = C(o.fin ?? '#b07a45');
  const n = g.attributes.position.count;
  const A = (name, size, fn) => { const arr = new Float32Array(n * size); for (let i = 0; i < n; i++) fn(arr, i * size); g.setAttribute(name, new THREE.BufferAttribute(arr, size)); };
  A('aMeta', 4, (a, i) => { a[i] = lvl; a[i + 1] = o.ord ?? 0; a[i + 2] = o.acc ?? 0; a[i + 3] = o.pat ?? 0; });
  A('aCenter', 3, (a, i) => { a[i] = c.x; a[i + 1] = c.y; a[i + 2] = c.z; });
  A('aFin', 3, (a, i) => { a[i] = fin.r; a[i + 1] = fin.g; a[i + 2] = fin.b; });
  A('aAxis', 3, (a, i) => { a[i] = axis.x; a[i + 1] = axis.y; a[i + 2] = axis.z; });
  buckets[kind].push(g);
}

/* ---- primitive builders ---- */
function boxAt(cx, cy, cz, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.BoxGeometry(sx, sy, sz);
  if (rx || ry || rz) g.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx, ry, rz)));
  g.translate(cx, cy, cz);
  return g;
}
function beam(a, b, w, h) {
  const d = b.clone().sub(a), len = d.length(); d.normalize();
  const g = new THREE.BoxGeometry(w, h, len);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(V(0, 0, 1), d));
  const m = a.clone().add(b).multiplyScalar(0.5);
  g.translate(m.x, m.y, m.z);
  g.userData.axis = d;
  return g;
}
function rod(a, b, r, radial = 6) {
  const d = b.clone().sub(a), len = d.length(); d.normalize();
  const g = new THREE.CylinderGeometry(r, r, len, radial);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(V(0, 1, 0), d));
  const m = a.clone().add(b).multiplyScalar(0.5);
  g.translate(m.x, m.y, m.z);
  g.userData.axis = d;
  return g;
}
function xform(g, pos, ry = 0) { g.applyMatrix4(new THREE.Matrix4().makeRotationY(ry)); g.translate(pos.x, pos.y, pos.z); return g; }

/* ---- layout constants (metres) ---- */
const DECK_Y = 4.2, SLAB_T = 0.14;
const PLAT = { x0: -3.2, x1: 3.2, z0: -4.4, z1: 2.9 };
const CAB = { x0: -1.9, x1: 1.3, z0: -3.6, z1: -1.0, wallH: 2.35 };
CAB.xc = (CAB.x0 + CAB.x1) / 2; CAB.zc = (CAB.z0 + CAB.z1) / 2;
const EAVE_Y = DECK_Y + CAB.wallH;                    // 6.55
const PITCH = THREE.MathUtils.degToRad(52);
const HALF_SPAN = (CAB.z1 - CAB.z0) / 2;              // 1.3
const RIDGE_Y = EAVE_Y + HALF_SPAN * Math.tan(PITCH); // ~8.21
const NEST = { x: 0.35, z: 0.35, y: 7.15, r: 1.1 };
const HATCH = { x: 2.3, z: 1.65, w: 0.7, d: 0.6 };

/* ---------------- 3a. Trunk (lofted, lobed buttresses) ---------------- */
const trunkC = (y) => ({ x: 0.12 * Math.sin(0.5 * (y - DECK_Y)), z: 0.1 * (Math.sin(0.4 * (y - DECK_Y) + 0.6) - Math.sin(0.6)) });
const trunkR = (y) => 0.55 - 0.26 * clamp01(Math.max(y, 0) / 10.6);
const BUTT = [[0.35, 0.85], [1.45, 0.55], [2.6, 0.8], [3.8, 0.5], [5.0, 0.65]];
function buttress(th) {
  let s = 0;
  for (const [a, amp] of BUTT) { const d = Math.atan2(Math.sin(th - a), Math.cos(th - a)); s += amp * Math.exp(-d * d / 0.18); }
  return s;
}
function trunkRadius(y, th) {
  const f = Math.pow(Math.max(0, 1 - y / 2.7), 2);
  const lump = 1 + 0.06 * noise3.noise(Math.cos(th) * 1.3 + 3.1, y * 0.9, Math.sin(th) * 1.3 + 1.7);
  return trunkR(y) * (1 + 0.3 * f) * lump + 0.55 * f * buttress(th);
}
function trunkPoint(y, th) {
  const c = trunkC(y), r = trunkRadius(y, th);
  return V(c.x + Math.cos(th) * r, y, c.z + Math.sin(th) * r);
}
(function buildTrunk() {
  const ys = [-0.4, 0, 0.12, 0.25, 0.4, 0.6, 0.85, 1.15, 1.5, 1.95, 2.5, 3.1, 3.75, 4.4, 5.1, 5.8, 6.5, 7.2, 7.6, 7.85, 8.05];
  const RAD = 28, pos = [], idx = [];
  for (const y of ys) {
    const sc = y > 8.0 ? 0.06 : y > 7.8 ? 0.65 : 1;
    for (let j = 0; j < RAD; j++) { const p = trunkPoint(y, j / RAD * Math.PI * 2), c = trunkC(y); pos.push(c.x + (p.x - c.x) * sc, p.y, c.z + (p.z - c.z) * sc); }
  }
  for (let i = 0; i < ys.length - 1; i++) for (let j = 0; j < RAD; j++) {
    const a = i * RAD + j, b = i * RAD + (j + 1) % RAD, c = (i + 1) * RAD + j, d = (i + 1) * RAD + (j + 1) % RAD;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  part(g, { kind: 'bark', lvl: 0, edges: 0, axis: V(0, 1, 0) });
  // drafted contour strokes: longitudinal lines + cross-section ellipses
  for (let k = 0; k < 9; k++) {
    const th = k / 9 * Math.PI * 2 + 0.2, pts = [];
    for (let y = 0; y <= 8.1; y += 0.45) pts.push(trunkPoint(y + (y < 0.01 ? 0.02 : 0), th));
    stroke(pts);
  }
  for (const y of [0.35, 1.2, 2.4, 3.6, 5.0, 6.2, 7.4]) {
    const pts = [];
    for (let j = 0; j <= 26; j++) pts.push(trunkPoint(y, j / 26 * Math.PI * 2));
    stroke(pts);
  }
})();

/* ---------------- 3b. Limbs, twigs, canopy ---------------- */
function tubeGeom(curve, segsN, radial, rFn, wob = 0) {
  const fr = curve.computeFrenetFrames(segsN, false), pos = [], idx = [], rings = [];
  for (let i = 0; i <= segsN; i++) {
    const t = i / segsN, p = curve.getPointAt(t), N = fr.normals[i], B = fr.binormals[i], r = rFn(t) * (i === segsN ? 0.06 : i === segsN - 1 ? 0.7 : 1), ring = [];
    for (let j = 0; j < radial; j++) {
      const th = j / radial * Math.PI * 2;
      const w = 1 + wob * noise3.noise(p.x * 2 + Math.cos(th), p.y * 2, p.z * 2 + Math.sin(th));
      const v = p.clone().addScaledVector(N, Math.cos(th) * r * w).addScaledVector(B, Math.sin(th) * r * w);
      pos.push(v.x, v.y, v.z); ring.push(v);
    }
    rings.push(ring);
  }
  for (let i = 0; i < segsN; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial, c = (i + 1) * radial + j, d = (i + 1) * radial + (j + 1) % radial;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return { g, rings };
}

const LIMBS = [
  { pts: [[0, 5.6, 0], [0.8, 6.3, 0.7], [1.6, 6.9, 1.4], [2.7, 7.9, 2.2], [3.6, 9.5, 2.5], [4.4, 11.2, 2.4]], r0: 0.25, r1: 0.05 },    // nest limb
  { pts: [[0, 7.0, 0], [-1.2, 7.9, -0.3], [-2.6, 9.3, -0.8], [-3.9, 11.0, -1.5], [-4.6, 12.4, -1.6]], r0: 0.24, r1: 0.05 },           // back-left over the roof
  { pts: [[0, 6.1, 0], [-1.5, 6.5, 0.9], [-3.2, 6.95, 1.5], [-4.9, 7.6, 1.75], [-6.2, 9.0, 1.6], [-7.1, 10.7, 1.1]], r0: 0.25, r1: 0.05 }, // swing limb
  { pts: [[0, 7.6, 0], [1.2, 8.3, -0.7], [2.7, 9.4, -1.6], [4.2, 10.9, -2.3], [5.2, 12.2, -2.7]], r0: 0.21, r1: 0.04 },               // back-right
  { pts: [[0, 7.4, 0], [-0.3, 9.0, 0.2], [0.2, 10.6, -0.3], [0.6, 12.2, -0.1], [0.4, 13.4, 0.2]], r0: 0.3, r1: 0.05 },                 // leader
  { pts: [[0, 7.7, 0], [-0.2, 9.4, -1.0], [-1.0, 10.9, -2.0], [-1.8, 12.0, -2.6]], r0: 0.17, r1: 0.04 }
].map((l) => ({ curve: new THREE.CatmullRomCurve3(l.pts.map((p) => V(...p)), false, 'catmullrom', 0.5), r0: l.r0, r1: l.r1 }));

/* =====================================================================
   4. HAND-DRAWN LINE SET (stage 1)
   Each segment gets: overshoot past both ends, a draw-order key (height
   from the ground, then distance from the trunk), a pressure value, and
   a small random offset for the faint second stroke.
   ===================================================================== */
const lineGeo = (() => {
  const n = segs.length;
  const keys = segs.map((s, i) => {
    const my = (s.a.y + s.b.y) / 2, rad = Math.hypot((s.a.x + s.b.x) / 2, (s.a.z + s.b.z) / 2);
    return { i, k: my + 0.32 * rad + rr(-0.9, 0.9) };
  }).sort((a, b) => a.k - b.k);
  const ordOf = new Float32Array(n);
  keys.forEach((e, rank) => { ordOf[e.i] = rank / n * 0.93; });
  const P = new Float32Array(n * 2 * 3), S = new Float32Array(n * 2 * 3), E = new Float32Array(n * 2 * 3), Tt = new Float32Array(n * 2);
  const O = new Float32Array(n * 2), Rn = new Float32Array(n * 2), Off = new Float32Array(n * 2 * 3);
  const d = V(0, 0, 0);
  segs.forEach((s, i) => {
    d.subVectors(s.b, s.a); const len = d.length(); if (len > 0) d.divideScalar(len);
    const a = s.a.clone(), b = s.b.clone();
    if (s.first) a.addScaledVector(d, -len * rr(0.04, 0.08));
    if (s.last) b.addScaledVector(d, len * rr(0.04, 0.08));
    for (const p of [a, b]) { p.x += rr(-0.004, 0.004); p.y += rr(-0.004, 0.004); p.z += rr(-0.004, 0.004); }
    const rn = rand(), ox = rr(-0.05, 0.05), oy = rr(-0.03, 0.05), oz = rr(-0.05, 0.05);
    for (let v = 0; v < 2; v++) {
      const j = i * 2 + v, j3 = j * 3;
      P[j3] = a.x; P[j3 + 1] = a.y; P[j3 + 2] = a.z;
      S[j3] = a.x; S[j3 + 1] = a.y; S[j3 + 2] = a.z;
      E[j3] = b.x; E[j3 + 1] = b.y; E[j3 + 2] = b.z;
      Tt[j] = v; O[j] = ordOf[i]; Rn[j] = rn;
      Off[j3] = ox; Off[j3 + 1] = oy; Off[j3 + 2] = oz;
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(P, 3));
  g.setAttribute('aStart', new THREE.BufferAttribute(S, 3));
  g.setAttribute('aEnd', new THREE.BufferAttribute(E, 3));
  g.setAttribute('aT', new THREE.BufferAttribute(Tt, 1));
  g.setAttribute('aOrd', new THREE.BufferAttribute(O, 1));
  g.setAttribute('aRnd', new THREE.BufferAttribute(Rn, 1));
  g.setAttribute('aOff', new THREE.BufferAttribute(Off, 3));
  return g;
})();

  const P = positionWorld;
  const d = mx_noise_float(P.mul(0.55)).mul(0.5).add(0.5).mul(0.75)
    .add(mx_noise_float(P.mul(4.1)).mul(0.12)).add(P.y.mul(0.012));

  const g2 = mx_noise_float(perp.mul(70).add(ax.mul(along).mul(4)));

const kindCfg = {

    const cut = smoothstep(cutY().sub(0.16), cutY(), positionWorld.y).mul(step(aLvl, 0.5)).mul(step(uMass, 0.999));
    mass = mix(mass, color(0xa98f5f), cut);
    return mix(mass, cfg.fin, fm).mul(float(1).sub(band.mul(0.3)));
  })();
  m.roughnessNode = mix(float(1), float(cfg.rough), fm);
  if (cfg.glass) m.emissiveNode = cfg.fin.mul(fm).mul(1.05);
  const mesh = new THREE.Mesh(merged[kind], m);
  mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
  return mesh;
}

/* ---- ground: massing plate -> grass, radial reveal + soft edge ---- */
const groundMat = new MeshStandardNodeMaterial();
groundMat.metalness = 0; groundMat.roughness = 1;
groundMat.transparent = true; groundMat.depthWrite = false;
{
  const { m: fm, band } = dissolve();
  groundMat.colorNode = Fn(() => {
    const P = positionWorld, r = length(vec2(P.x, P.z));
    const n = mx_noise_float(P.mul(0.32)).mul(0.5).add(0.5);
    const n2 = mx_noise_float(P.mul(1.7).add(9.0)).mul(0.5).add(0.5);
    const blade = mx_noise_float(vec3(P.x.mul(14), 0.5, P.z.mul(14))).mul(0.06);
    let grass = mix(mix(color(0x6e8536), color(0x9aa653), n), color(0xbcae62), smoothstep(0.62, 0.9, n2).mul(0.7));
    grass = grass.mul(float(1).add(blade));
    const dirt = smoothstep(0.0, 1.0, float(2.6).sub(r).add(mx_noise_float(P.mul(1.3)).mul(0.9)));
    grass = mix(grass, color(0x6d553a), dirt.mul(0.9));
    const plate = mix(color(0xdcd6c6), color(0xd2cbb8), n.mul(0.4));
    return mix(plate, grass, fm).mul(float(1).sub(band.mul(0.25)));
  })();
  groundMat.opacityNode = Fn(() => {
    const P = positionWorld, r = length(vec2(P.x, P.z));
    const rev = uGround.mul(80);
    const reveal = float(1).sub(smoothstep(rev.sub(7), rev, r));
    const edge = float(1).sub(smoothstep(16, 46, r));
    return reveal.mul(edge);
  })();
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 96).rotateX(-Math.PI / 2), groundMat);
ground.receiveShadow = true; ground.renderOrder = 1; ground.frustumCulled = false;

/* ---- sky dome: canary trace paper -> model-shop white -> golden hour ---- */
const skyMat = new MeshBasicNodeMaterial();
skyMat.side = THREE.BackSide; skyMat.depthWrite = false; skyMat.fog = false;
skyMat.colorNode = Fn(() => {
  const px = screenUV.mul(uRes);
  // paper: fibre grain (rotated stretched noise) + soft mottling + fine tooth
  const rot = (a) => vec2(px.x.mul(Math.cos(a)).sub(px.y.mul(Math.sin(a))), px.x.mul(Math.sin(a)).add(px.y.mul(Math.cos(a))));
  const r1 = rot(0.35), r2 = rot(-0.7), r3 = rot(1.2);
  const f1 = smoothstep(0.42, 0.9, mx_noise_float(vec3(r1.x.mul(0.02), r1.y.mul(0.55), 3.0)));
  const f2 = smoothstep(0.45, 0.9, mx_noise_float(vec3(r2.x.mul(0.018), r2.y.mul(0.6), 9.0)));
  const f3 = smoothstep(0.5, 0.92, mx_noise_float(vec3(r3.x.mul(0.03), r3.y.mul(0.7), 14.0)));
  const mott = mx_noise_float(vec3(px.x.mul(0.004), px.y.mul(0.004), 1.0)).mul(0.028);
  const tooth = mx_noise_float(vec3(px.x.mul(0.9), px.y.mul(0.9), 5.0)).mul(0.012);
  let paper = color(0xefe3b8).mul(float(1).add(mott).add(tooth)).mul(float(1).sub(f1.mul(0.09)).sub(f2.mul(0.07))).add(f3.mul(0.045));
  const vg = length(screenUV.sub(0.5)).mul(0.5);
  paper = paper.mul(float(1).sub(vg.mul(vg).mul(0.5)));
  // model-shop white-warm
  const shop = mix(color(0xe9e2d2), color(0xf3efe6), smoothstep(0.0, 1.0, screenUV.y));
  // golden hour sky: warm peach at the horizon, pale clear blue high up
  const dir = normalize(positionWorld.sub(cameraPosition));
  const e = dir.y;
  const hz = color(0xf6c793), mid = color(0xf5dfc0), top = color(0x98c2e0);
  let sky = mix(hz, mid, smoothstep(-0.03, 0.07, e));
  sky = mix(sky, top, smoothstep(0.05, 0.34, e));
  sky = mix(sky, color(0xffd59a), pow(max(dot(dir, uSunDir), 0), 7).mul(0.22));
  return mix(mix(paper, shop, uBgShop), sky, uSky);
})();
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;

/* ---- graphite lines: main stroke + faint offset second stroke ---- */
function lineMaterial(second) {
  const m = new LineBasicNodeMaterial();
  m.transparent = true; m.depthWrite = false; m.fog = false;
  const aS = attribute('aStart', 'vec3'), aE = attribute('aEnd', 'vec3'), aT = attribute('aT', 'float');
  const aO = attribute('aOrd', 'float'), aR = attribute('aRnd', 'float'), aOff = attribute('aOff', 'vec3');
  const seg = clamp(uLine.mul(1.08).sub(aO).div(0.07), 0, 1);
  let pos = mix(aS, aE, aT.mul(seg));
  if (second) pos = pos.add(aOff);
  m.positionNode = pos;
  m.colorNode = color(0x3b3a36);
  m.opacityNode = uLineOp.mul(mix(0.55, 1.0, aR)).mul(second ? 0.34 : 0.92).mul(step(0.002, seg));
  return m;
}
const linesMain = new THREE.LineSegments(lineGeo, lineMaterial(false));
const linesFaint = new THREE.LineSegments(lineGeo, lineMaterial(true));
for (const l of [linesMain, linesFaint]) { l.frustumCulled = false; l.renderOrder = 2; }

/* ---- lights ---- */
const hemi = new THREE.HemisphereLight(0xfffaf0, 0xd8cdb4, 1.6);
const sun = new THREE.DirectionalLight(0xfff3e0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20; sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 3;
sun.target.position.set(0, 4, 0);
const lamp = new THREE.PointLight(0xffa850, 0, 5, 1.6);
lamp.position.set(-0.4, 5.5, -0.1);

const solids = Object.keys(merged).map(makeSolid);
scene.add(sky, ground, hemi, sun, sun.target, lamp, linesMain, linesFaint, ...solids);

/* =====================================================================
   6. PROGRESS -> UNIFORMS / LIGHTS / FOG
   ===================================================================== */
const cA = new THREE.Color(), cB = new THREE.Color();
const sunDir = new THREE.Vector3();
function applyProgress(t) {
  const tt = Math.min(t, DUR);
  const p = tt / DUR;
  const l1 = clamp01((tt - STAGE_START[0]) / STAGE_LEN[0]);
  const l2 = clamp01((tt - STAGE_START[1]) / STAGE_LEN[1]);
  const l3 = clamp01((tt - STAGE_START[2]) / STAGE_LEN[2]);
  const l4 = clamp01((tt - STAGE_START[3]) / STAGE_LEN[3]);
  uProgress.value = p;
  uLine.value = smooth(l1 * 0.15 + l1 * 0.85);            // near-linear draw
  uMass.value = 0.5 * (l2 + smooth(l2));
  uDetail.value = l3;
  uFinish.value = l4;
  uGround.value = clamp01(l2 * 3.2);
  // graphite: full -> 20% (massing) -> 10% (detail) -> gone (finished)
  uLineOp.value = (1 - 0.8 * smooth(l2 * 1.2)) * (1 - 0.5 * l3) * (1 - smooth(l4 * 1.4));
  uBgShop.value = smooth(l2 / 0.6);
  uSky.value = smooth(l4 / 0.85);

  // solids only exist from stage 2 on
  const showSolid = tt >= STAGE_START[1] - 0.001;
  for (const s of solids) s.visible = showSolid;
  ground.visible = showSolid;
  linesMain.visible = linesFaint.visible = uLineOp.value > 0.004;

  // light: soft daylight (model shop) -> low warm golden-hour sun
  const g = smooth(l4 / 0.9);
  const el = THREE.MathUtils.degToRad(lerp(58, 15, g)), az = THREE.MathUtils.degToRad(lerp(-35, -52, g));
  sunDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 90);
  uSunDir.value.copy(sunDir);
  sun.color.set(0xfff3e0).lerp(cA.set(0xffc78f), g);
  sun.intensity = lerp(2.5, 3.9, g);
  hemi.color.set(0xfffaf0).lerp(cA.set(0xb4cde0), g);
  hemi.groundColor.set(0xd8cdb4).lerp(cA.set(0x7d8248), g);
  hemi.intensity = lerp(1.7, 1.6, g);
  lamp.intensity = 7 * smooth((l4 - 0.35) / 0.5);
  scene.fog.color.set(0xf3cfa4);
  scene.fog.density = 0.011 * smooth(l4 / 0.9);
}

/* =====================================================================
   7. UI: title block, scrubber, play/pause, keys
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const scrub = $('scrub'), playBtn = $('play'), ticksEl = $('ticks'), fadeEl = $('fade');
let t = 0, playing = true, stageIdx = -1, fadeIn = 0;
const tickBtns = STAGE_START.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'tick'; b.type = 'button'; b.textContent = '0' + (i + 1);
  b.style.left = (s / DUR * 100) + '%';
  b.setAttribute('aria-label', 'Jump to sheet ' + SHEETS[i][0] + ', ' + SHEETS[i][1]);
  b.addEventListener('click', () => jumpStage(i));
  ticksEl.appendChild(b); return b;
});
function stageAt(tt) { let s = 0; for (let i = 0; i < 4; i++) if (tt >= STAGE_START[i] - 1e-6) s = i; return s; }
function setPlaying(v) { playing = v; playBtn.textContent = v ? 'PAUSE' : 'PLAY'; }
function jumpStage(i) { t = STAGE_START[i]; fadeIn = 0; fadeEl.style.opacity = 0; sync(); }
function sync() {
  applyProgress(t);
  const s = stageAt(Math.min(t, DUR));
  if (s !== stageIdx) {
    stageIdx = s;
    $('sheetNo').textContent = SHEETS[s][0]; $('sheetName').textContent = SHEETS[s][1];
    tickBtns.forEach((b, i) => b.classList.toggle('on', i === s));
  }
  scrub.value = Math.round(Math.min(t, DUR) / DUR * 1000);
  scrub.setAttribute('aria-valuetext', SHEETS[s][0] + ' ' + SHEETS[s][1]);
}
playBtn.addEventListener('click', () => { setPlaying(!playing); if (playing && t >= DUR) t = 0; });
scrub.addEventListener('input', () => { setPlaying(false); t = scrub.value / 1000 * DUR; fadeIn = 0; fadeEl.style.opacity = 0; sync(); });
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key >= '1' && e.key <= '4') jumpStage(+e.key - 1);
});
// debug / verification hooks
window.__setProgress = (p) => { setPlaying(false); t = clamp01(p) * DUR; fadeIn = 0; fadeEl.style.opacity = 0; sync(); };
window.__setTime = (s) => { setPlaying(false); t = s; sync(); };
window.__play = (v) => setPlaying(!!v);
window.__view = { camera, controls };
Object.defineProperty(window, '__state', { get: () => ({ t, playing, stage: stageIdx, backend: renderer.backend && renderer.backend.constructor.name }) });

/* =====================================================================
   8. RESIZE, FIT, LOOP
   ===================================================================== */
let fit = 25;
function fitDistance() {
  const tf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(10.3 / tf, 8.6 / (tf * camera.aspect));
}
function resize(first) {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  // nudge the picture up so the tree sits in the free area above the UI
  const uiH = document.querySelector('.ui').getBoundingClientRect().height + 24;
  camera.setViewOffset(w, h, 0, Math.round(uiH * (w <= 640 ? 0.42 : 0.2)), w, h);
  camera.updateProjectionMatrix();
  uRes.value.set(w, h);
  const nf = fitDistance();
  const off = camera.position.clone().sub(controls.target);
  off.setLength(first ? nf : off.length() * nf / fit);
  camera.position.copy(controls.target).add(off);
  controls.maxDistance = Math.max(46, nf * 1.5);
  fit = nf;
}
window.addEventListener('resize', () => resize(false));

try {
  await renderer.init();
  resize(true);
  sync();
  $('boot').remove();
  let last = performance.now();
  renderer.setAnimationLoop((now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) {
      t += dt;
      if (t >= DUR + FADE_OUT) { t = 0; fadeIn = FADE_IN; }
    }
    if (fadeIn > 0) { fadeIn = Math.max(0, fadeIn - dt); fadeEl.style.opacity = fadeIn / FADE_IN; }
    else fadeEl.style.opacity = playing && t > DUR ? clamp01((t - DUR) / FADE_OUT) : 0;
    sync();
    controls.update(dt);
    if (camera.position.y < 0.9) camera.position.y = 0.9;
    renderer.render(scene, camera);
  });
} catch (err) {
  console.error(err);
  $('boot').textContent = 'This browser could not start WebGPU or WebGL 2.';
}
</script>
</body>
</html>
